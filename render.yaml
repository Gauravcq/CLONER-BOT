services:
  - type: worker
    name: telegram-cloner-bot
    env: python
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python Bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
