services:
  - type: worker
    name: telegram-cloner-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python Bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
